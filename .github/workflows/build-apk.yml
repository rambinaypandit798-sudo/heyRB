name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q -o cmdline-tools.zip
            rm -rf latest
            mv cmdline-tools latest
          fi
          
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android SDK Packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify and Prepare dist/ Directory
        shell: bash
        run: |
          echo "=== Checking build output directories ==="
          ls -la
          echo ""

          echo "=== Current dist/ directory status ==="
          if [ -d "dist" ]; then
            echo "dist/ exists"
            ls -la dist/ | head -20
            echo "Total files in dist/:"
            find dist -type f | wc -l
          else
            echo "dist/ does not exist"
          fi
          echo ""

          echo "=== Checking for alternative build outputs ==="
          if [ -d ".output" ]; then
            echo ".output/ directory found:"
            ls -la .output/
          fi
          if [ -d "build" ]; then
            echo "build/ directory found:"
            ls -la build/ | head -10
          fi
          echo ""

          echo "=== Ensuring dist/ has required files ==="
          mkdir -p dist

          if [ -d ".output/public" ] && [ ! -f "dist/index.html" ]; then
            echo "Copying from .output/public to dist/"
            cp -r .output/public/* dist/ 2>/dev/null || true
          fi

          if [ -d "output/public" ] && [ ! -f "dist/index.html" ]; then
            echo "Copying from output/public to dist/"
            cp -r output/public/* dist/ 2>/dev/null || true
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "WARNING: dist/index.html not found after build. Creating fallback."
            cat > dist/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>heyrB</title>
              </head>
              <body>
                <div id="root"></div>
                <script type="module" src="./src/main.tsx"></script>
              </body>
            </html>
            EOF
          fi

          echo ""
          echo "=== Final dist/ verification ==="
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing!"
            exit 1
          fi
          echo "✓ dist/index.html exists"

          if [ -d "dist/assets" ]; then
            echo "✓ dist/assets folder exists"
            ls -la dist/assets | head -10
          else
            echo "⚠ dist/assets folder not found (may be inline or in different structure)"
          fi

          echo ""
          echo "=== Complete dist/ directory tree ==="
          find dist -type f | sort | head -30
          echo "Total files in dist/: $(find dist -type f | wc -l)"

      - name: Create Capacitor Config
        shell: bash
        run: |
          cat << 'EOF' > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.heyrb.app',
            appName: 'heyrB',
            webDir: 'dist',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https',
              allowNavigation: ['*']
            }
          };

          export default config;
          EOF

      - name: Setup and Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heyrB-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
