name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Isse aap manually bhi run kar sakte hain

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout karein
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Node.js Setup karein (Capacitor/React ke liye)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Java 17 Setup karein (Android build ke liye zaroori)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Android SDK Setup karein
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Gradle Cache karein (Build fast karne ke liye)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Dependencies Install karein
      - name: Install NPM Dependencies
        run: npm install

      # 7. Web Code Build karein (Vite build)
      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 8. Capacitor Sync karein (Web code ko Android mein daalein)
      - name: Capacitor Sync
        run: npx cap sync android

      # 9. Android Debug APK Build karein
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. APK ko Artifact ke roop mein Upload karein
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heyrB-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
